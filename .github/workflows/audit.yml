name: Dependency audit

# T64: a new advisory can appear for a package we already ship without any push. Every week,
# audit the production dependencies against the npm registry's advisory list. A finding fails
# the run, so GitHub emails the owner. CI runs the same audit on every push (ci.yml).
on:
  schedule:
    - cron: '0 6 * * 3' # Wednesdays, 06:00 UTC
  workflow_dispatch:
  # When this workflow changes, run it to prove it still works.
  push:
    paths:
      - '.github/workflows/audit.yml'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit --prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits; the comment shows the release.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No version input: pnpm is read from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The audit reads the lockfile only; nothing is installed.
      - name: Dependency audit (production)
        run: pnpm audit --prod

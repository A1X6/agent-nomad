name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# The CI job only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older run, except on main and dev (BP-04): every
# commit there keeps its run, so the release gate and Render's checksPass can find it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Finish every OS even if one fails, so all failures show at once.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Lowest supported Node (package.json engines) and the current LTS.
        node: ['22.13', '24']

    steps:
      # Actions are pinned to exact commits; the comment shows the release.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # No version input: pnpm is read from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, format check and tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != '24'
        run: pnpm check

      # PERF-02: the same checks in this one job, but the tests run once, with coverage. A failing
      # test fails the build here too. No coverage threshold yet (T64).
      - name: Typecheck, lint, format check and tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: pnpm typecheck && pnpm lint && pnpm format:check && pnpm test:coverage

      # T64: these do not depend on the OS or Node version, so they run in one job only.
      # Known security advisories in the packages users install (the weekly run is audit.yml).
      - name: Dependency audit (production)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: pnpm audit --prod

      # The migrations agree with each other and with the snapshots. Offline: no database and
      # no secret. It loads schema.ts, which needs the contracts build that `pnpm typecheck` made.
      - name: Migration consistency check
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: pnpm --filter @agentnomad/server db:check

      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      # Unused files, dependencies and exports (knip.json). Any finding fails the build (T65).
      - name: Unused code check
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: pnpm knip

      # T40: the npm package exactly as users get it: built, packed, installed globally, and
      # run as the `agentnomad` command, on every OS and both Node versions.
      - name: Build, pack and install the npm package
        shell: bash
        run: |
          pnpm release:build
          npm pack ./packages/cli/release --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/agentnomad-*.tgz

      - name: The installed command works
        shell: bash
        run: |
          expected="$(node -p "require('./packages/cli/package.json').version")"
          actual="$(agentnomad --version)"
          echo "agentnomad --version: $actual"
          test "$actual" = "$expected"
          agentnomad --help > /dev/null
          agentnomad help pull > /dev/null

      # T37 + T40: all three e2e steps on this OS, each on a fresh "PC", run with the
      # globally installed package rather than the workspace build.
      - name: End-to-end with the installed package
        shell: bash
        run: |
          export E2E_CLI="$(npm root -g)/agentnomad/dist/agentnomad.js"
          pnpm --filter @agentnomad/e2e run e2e

      # Linux runners have no keychain, so the step above tests the file fallback. This runs
      # the keychain tests again against a real, unlocked GNOME Keyring (Secret Service),
      # set up the way @napi-rs/keyring's own CI does it.
      - name: Linux keychain (GNOME Keyring over Secret Service)
        if: runner.os == 'Linux'
        env:
          AGENTNOMAD_EXPECT_KEYCHAIN: '1'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnome-keyring dbus dbus-x11
          dbus-run-session -- bash -c 'echo -n test | gnome-keyring-daemon --unlock && pnpm --filter @agentnomad/cli exec vitest run test/secret-store.test.ts'

  # T37: a setup saved on one OS is restored on another and back. Each step runs on its own
  # machine against a local API (never the hosted one); the database goes to the next step
  # as an artifact. Two chains: macOS → Windows → macOS and Linux → Windows → Linux, as
  # separate jobs, so a failure in one chain does not skip the other's later steps (QA-15).
  e2e-mac-step-1:
    name: e2e ${{ matrix.chain }} / step 1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include: [{ chain: mac-win-mac, os: macos-latest }]
    steps: &e2e-steps
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The step number comes from the job id: e2e-<chain>-step-<n>.
      - name: Download the database from the previous step
        if: ${{ !endsWith(github.job, '-step-1') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-${{ matrix.chain }}-${{ endsWith(github.job, '-step-2') && '1' || '2' }}
          path: ${{ runner.temp }}/in

      - name: Run the step
        shell: bash
        env:
          E2E_STEP: ${{ endsWith(github.job, '-step-1') && '1' || endsWith(github.job, '-step-2') && '2' || '3' }}
          E2E_DB_IN: ${{ !endsWith(github.job, '-step-1') && format('{0}/in/db.tgz', runner.temp) || '' }}
          E2E_DB_OUT: ${{ runner.temp }}/out/db.tgz
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          pnpm --filter @agentnomad/e2e run e2e

      - name: Hand the database to the next step
        if: ${{ !endsWith(github.job, '-step-3') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.chain }}-${{ endsWith(github.job, '-step-1') && '1' || '2' }}
          path: ${{ runner.temp }}/out/db.tgz
          retention-days: 1
          if-no-files-found: error

  e2e-mac-step-2:
    name: e2e ${{ matrix.chain }} / step 2 (${{ matrix.os }})
    needs: e2e-mac-step-1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include: [{ chain: mac-win-mac, os: windows-latest }]
    steps: *e2e-steps

  e2e-mac-step-3:
    name: e2e ${{ matrix.chain }} / step 3 (${{ matrix.os }})
    needs: e2e-mac-step-2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include: [{ chain: mac-win-mac, os: macos-latest }]
    steps: *e2e-steps

  e2e-linux-step-1:
    name: e2e ${{ matrix.chain }} / step 1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include: [{ chain: linux-win-linux, os: ubuntu-latest }]
    steps: *e2e-steps

  e2e-linux-step-2:
    name: e2e ${{ matrix.chain }} / step 2 (${{ matrix.os }})
    needs: e2e-linux-step-1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include: [{ chain: linux-win-linux, os: windows-latest }]
    steps: *e2e-steps

  e2e-linux-step-3:
    name: e2e ${{ matrix.chain }} / step 3 (${{ matrix.os }})
    needs: e2e-linux-step-2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include: [{ chain: linux-win-linux, os: ubuntu-latest }]
    steps: *e2e-steps

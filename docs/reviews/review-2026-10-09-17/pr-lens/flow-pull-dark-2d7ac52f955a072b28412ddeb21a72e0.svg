<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1638 555" width="1638" height="555" role="img" aria-label="Pulling a changed plugin" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>Pulling a changed plugin</title>
<desc>Two more full reviews of the plugins-in-the-skills-folder work (T95, T96), 83 findings fixed. The plugin path rules and the account-skills paths now live in global-paths.ts, which ends the one import cycle and the pure modules' reach to node:fs; the env scan reads a plugin's manifest lists and wrapper-less .mcp.json the way the plugin review does; pull asks about a changed plugin's differing files once, as the folder; a saved claude.ai skill that is a plugin is never added as a local skill; the walker stats each file once. 80 new tests pin the branches the reviews found untested, and a test keeps the import graph free of cycles.</desc>
